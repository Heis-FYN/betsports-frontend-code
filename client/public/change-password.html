<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAXWIN | Change password</title>
<style>:root{--bg:#080b0a;--panel:#111816;--line:#24342d;--gold:#f5c542;--green:#12b76a;--muted:#8ea39a;--text:#f3f7f4;--danger:#f87171}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#1c2a20 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);padding:30px;background:rgba(17,24,22,.96);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 80px #0008}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand img{width:54px;height:54px;object-fit:contain;border-radius:12px;background:#000}.brand strong{font-size:23px;letter-spacing:.08em;color:var(--gold)}.brand small{display:block;color:var(--muted);margin-top:3px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input{width:100%;background:#0c1210;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;outline:none}.field input:focus{border-color:var(--green)}button{border:0;border-radius:10px;padding:12px 15px;font:inherit;font-weight:800;cursor:pointer}.submit{width:100%;color:#07140d;background:var(--green)}.back{display:block;text-align:center;color:var(--muted);margin-top:16px;font-size:13px;text-decoration:none}.back:hover{color:var(--gold)}.message{padding:10px;border-radius:9px;font-size:13px;margin-bottom:14px}.error{color:#fecaca;background:#3c1717;border:1px solid #6d2727}.success{color:#d5f8e5;background:#103622;border:1px solid #1d7548}</style></head>
<body><main class="card"><div class="brand"><img src="/assets/msport/z-sports-logo.png" alt="MAXWIN"><div><strong>MAXWIN</strong><small>Change your account password</small></div></div><div id="message"></div><form id="passwordForm"><div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" minlength="10" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="10" autocomplete="new-password" required></div><button class="submit">Change password</button></form><a class="back" href="/">Return to MAXWIN</a></main><script>
const token=localStorage.getItem('accessToken')||'';const message=document.getElementById('message');const show=(text,ok=false)=>{message.className=`message ${ok?'success':'error'}`;message.textContent=text};if(!token)show('Please sign in first, then open Change password from your profile menu.');document.getElementById('passwordForm').onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.target));if(data.newPassword!==data.confirmPassword)return show('New passwords do not match.');if(!token)return show('Please sign in first.');try{const response=await fetch('https://betsports-backend.onrender.com/api/auth/change-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({currentPassword:data.currentPassword,newPassword:data.newPassword})});const body=await response.json().catch(()=>({}));if(!response.ok)throw Error(body?.error?.message||'Unable to change password.');event.target.reset();show('Password changed successfully.',true)}catch(error){show(error.message)}};
</script></body></html>
