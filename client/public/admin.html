<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MAXWIN Admin</title>
  <link rel="icon" type="image/png" href="/maxwin-logo.png" />
  <style>
    :root{--bg:#080b0a;--panel:#111816;--panel2:#16201c;--line:#24342d;--gold:#f5c542;--green:#12b76a;--blue:#3b82f6;--muted:#8ea39a;--text:#f3f7f4;--danger:#f87171}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#1c2a20 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:rgba(17,24,22,.96);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 80px #0008}.login .card{width:min(440px,100%);padding:30px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.brand img{width:54px;height:54px;object-fit:contain;border-radius:12px;background:#000}.brand strong{font-size:23px;letter-spacing:.08em;color:var(--gold)}.brand small{display:block;color:var(--muted);margin-top:3px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input,.field select,.field textarea{width:100%;background:#0c1210;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}.password-wrap{position:relative}.password-wrap input{padding-right:46px}.password-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);padding:6px;line-height:0}.password-toggle:hover{color:var(--text)}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;color:#07140d;background:var(--gold)}.btn.green{background:var(--green)}.btn.blue{background:var(--blue);color:#fff}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.danger{background:var(--danger);color:#200}.btn.small{padding:7px 10px;font-size:12px}.error{color:#fecaca;background:#3c1717;border:1px solid #6d2727;padding:10px;border-radius:9px;font-size:13px}.notice{color:#d5f8e5;background:#103622;border:1px solid #1d7548;padding:10px;border-radius:9px;font-size:13px}.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:#0b100e;padding:22px 14px;display:flex;flex-direction:column}.side .brand{padding:0 10px;margin-bottom:26px}.side .brand img{width:42px;height:42px}.side .brand strong{font-size:17px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:var(--muted);border:1px solid transparent;text-align:left;padding:12px 13px;border-radius:10px;font-weight:700}.nav button.active,.nav button:hover{color:var(--text);background:var(--panel2);border-color:var(--line)}.side footer{margin-top:auto;color:var(--muted);font-size:12px;padding:12px}.main{padding:28px;max-width:1600px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(6,minmax(130px,1fr))}.stat{padding:18px}.stat .value{font-size:25px;font-weight:900;color:var(--gold);margin-top:8px}.stat .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em}.panel{padding:20px;margin-bottom:18px}.panel h2{font-size:17px;margin:0 0 16px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.toolbar .field{margin:0;min-width:190px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;background:#0c1210}tr:last-child td{border-bottom:0}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#1c2d24;color:#bdf5d2}.badge.pending{background:#3a2d12;color:#f9da78}.badge.rejected{background:#3d1919;color:#ffb4b4}.badge.live{background:#122c48;color:#a8d1ff}.muted{color:var(--muted)}.positive{color:#83e6ac}.negative{color:#ff9c9c}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:5}.modal .card{width:min(520px,100%);padding:24px}.modal h2{margin-top:0}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.empty{padding:28px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;z-index:10;padding:13px 16px;border-radius:10px;background:#173d2a;border:1px solid #2b8655;color:#d6ffe5}.toast.bad{background:#401b1b;border-color:#853737;color:#ffd0d0}@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.app{display:block}.side{position:static;border-right:0;border-bottom:1px solid var(--line)}.side footer{display:none}.nav{grid-template-columns:repeat(3,1fr)}.nav button{font-size:12px}.main{padding:18px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
const API = document.querySelector('meta[name="betsports-api"]')?.content || 'https://betsports-backend.onrender.com';
let token = localStorage.getItem('maxwin_admin_token') || '';
let state = { section:'overview', admin:null };
const root = document.getElementById('root');
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money = value => `${Number(value || 0).toFixed(2)} GHS`;
async function api(path, options={}) { const headers={'Content-Type':'application/json',...(options.headers||{})}; if(token) headers.Authorization=`Bearer ${token}`; const res=await fetch(`${API}${path}`,{...options,headers}); const body=await res.json().catch(()=>({})); if(!res.ok) throw new Error(body?.error?.message || body?.error_description || 'Request failed'); return body.data; }
function toast(message,bad=false){const el=document.createElement('div');el.className=`toast ${bad?'bad':''}`;el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),3500)}
function passwordField(id,name,label,attrs=''){return `<div class="password-wrap"><input id="${id}" name="${name}" type="password" placeholder="${label}" ${attrs} required><button type="button" class="password-toggle" data-password-toggle="${id}" aria-label="Show password">Show</button></div>`}
function bindPasswordToggles(scope=document){scope.querySelectorAll('[data-password-toggle]').forEach(button=>{button.onclick=()=>{const input=document.getElementById(button.dataset.passwordToggle);if(!input)return;const visible=input.type==='text';input.type=visible?'password':'text';button.textContent=visible?'Show':'Hide';button.setAttribute('aria-label',visible?'Show password':'Hide password')}})}
function loginView(message=''){root.innerHTML=`<main class="login"><section class="card"><div class="brand"><img src="/maxwin-logo.png"><div><strong>MAXWIN</strong><small>Administrator console</small></div></div>${message?`<div class="error">${esc(message)}</div>`:''}<form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label>${passwordField('adminLoginPassword','password','Password','autocomplete=\"current-password\" autofocus')}</div><button class="btn green" style="width:100%">Sign in securely</button></form><p class="muted" style="font-size:12px;margin-bottom:0">Provider integrations are disabled. This console only manages internal records and approval states.</p></section></main>`;bindPasswordToggles();document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const result=await api('/api/admin/auth/login',{method:'POST',body:JSON.stringify(data)});token=result.token;localStorage.setItem('maxwin_admin_token',token);state.admin=result.admin;if(result.mustChangePassword) return changePasswordView(); await appView()}catch(err){loginView(err.message)}}}
function changePasswordView(){root.innerHTML=`<main class="login"><section class="card"><div class="brand"><img src="/maxwin-logo.png"><div><strong>MAXWIN</strong><small>Secure your administrator account</small></div></div><div class="notice">Your initial password must be changed before you can use the admin console.</div><form id="changeForm"><div class="field"><label>New password</label>${passwordField('newAdminPassword','password','New password','minlength=\"10\" autocomplete=\"new-password\" autofocus')}</div><div class="field"><label>Confirm new password</label>${passwordField('confirmAdminPassword','confirm','Confirm new password','minlength=\"10\" autocomplete=\"new-password\"')}</div><button class="btn green" style="width:100%">Change password</button></form></section></main>`;bindPasswordToggles();document.getElementById('changeForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(data.password!==data.confirm)return toast('Passwords do not match',true);try{await api('/api/admin/auth/change-password',{method:'POST',body:JSON.stringify({password:data.password})});toast('Password changed');await appView()}catch(err){toast(err.message,true)}}}
const nav=[['overview','Overview'],['matches','Matches'],['users','Users'],['wallet','Deposits & withdrawals'],['bets','Bets & stakes'],['audit','Audit log'],['admins','Administrators'],['security','Change password']]; const visibleNav=()=>state.admin?.role==='SUPER_ADMIN'?nav:nav.filter(([id])=>id!=='admins');
async function appView(){root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><img src="/maxwin-logo.png"><div><strong>MAXWIN</strong><small>${state.admin?.role==='SUPER_ADMIN'?'Super admin':'Admin'}</small></div></div><nav class="nav">${visibleNav().map(([id,label])=>`<button data-section="${id}" class="${state.section===id?'active':''}">${label}</button>`).join('')}</nav><footer>${esc(state.admin?.email||'')}<br><button id="logout" class="btn ghost small" style="margin-top:10px">Sign out</button></footer></aside><main class="main"><div class="top"><div><h1 id="title">Admin overview</h1><p>Control center for internal MaxWin operations.</p></div><div class="actions"><span class="badge">${state.admin?.role==='SUPER_ADMIN'?'SUPER_ADMIN':'ADMIN'}</span><button id="refresh" class="btn ghost small">Refresh</button></div></div><section id="content"></section></main></div>`;document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{state.section=b.dataset.section;appView()});document.getElementById('logout').onclick=async()=>{try{await api('/api/admin/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('maxwin_admin_token');token='';loginView('You have been signed out')};document.getElementById('refresh').onclick=()=>renderSection();await renderSection()}
async function renderSection(){const content=document.getElementById('content');if(!content)return;document.getElementById('title').textContent=nav.find(x=>x[0]===state.section)?.[1]||'Admin';content.innerHTML='<div class="panel"><div class="empty">Loading…</div></div>';try{if(state.section==='overview')return overview(content);if(state.section==='matches')return matches(content);if(state.section==='users')return users(content);if(state.section==='wallet')return wallet(content);if(state.section==='bets')return bets(content);if(state.section==='audit')return audit(content);if(state.section==='admins'&&state.admin?.role==='SUPER_ADMIN')return admins(content);if(state.section==='security')return security(content)}catch(err){content.innerHTML=`<div class="error">${esc(err.message)}</div>`}}
async function security(el){el.innerHTML=`<div class="panel card"><h2>Change password</h2><p class="muted">Update the password for your current administrator or super administrator account. Your current password is required.</p><form id="securityForm"><div class="field"><label>Current password</label>${passwordField('currentAdminPassword','currentPassword','Current password','autocomplete="current-password"')}</div><div class="field"><label>New password</label>${passwordField('newAdminPassword','password','New password','minlength="10" autocomplete="new-password"')}</div><div class="field"><label>Confirm new password</label>${passwordField('confirmAdminPassword','confirm','Confirm new password','minlength="10" autocomplete="new-password"')}</div><button class="btn green">Change password</button></form></div>`;bindPasswordToggles();document.getElementById('securityForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(data.password!==data.confirm)return toast('Passwords do not match',true);try{await api('/api/admin/auth/change-password',{method:'POST',body:JSON.stringify({currentPassword:data.currentPassword,password:data.password})});e.target.reset();toast('Password changed successfully')}catch(err){toast(err.message,true)}}}

async function admins(el){const rows=await api('/api/admin/admins');el.innerHTML=`<div class="panel card"><div class="actions" style="justify-content:space-between"><div><h2>Administrator accounts</h2><p class="muted">Only the SUPER_ADMIN can create administrators. New administrators must change their temporary password on first login.</p></div><button class="btn" id="newAdmin">Add administrator</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>First-login password</th><th>Created</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${a.id}</td><td>${esc(a.name)}</td><td>${esc(a.email)}</td><td><span class="badge">${esc(a.role)}</span></td><td>${a.force_password_change?'Required':'Completed'}</td><td>${esc(a.created_at)}</td></tr>`).join('')}</tbody></table></div></div>`;document.getElementById('newAdmin').onclick=()=>adminModal()}
function adminModal(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<section class="card"><h2>Add administrator</h2><p class="muted">The new administrator will sign in with this temporary password and be forced to set a new password immediately.</p><form id="adminForm"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Temporary password</label>${passwordField('temporaryAdminPassword','password','Temporary password','minlength=\"10\" autocomplete=\"new-password\"')}</div><div class="actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn green">Create administrator</button></div></form></section>`;document.body.appendChild(m);bindPasswordToggles(m);m.querySelector('#cancel').onclick=()=>m.remove();m.querySelector('form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api('/api/admin/admins',{method:'POST',body:JSON.stringify(data)});m.remove();toast('Administrator created; first-login password change is required');renderSection()}catch(err){toast(err.message,true)}}}
async function overview(el){const d=await api('/api/admin/overview');el.innerHTML=`<div class="grid stats">${[['users','Users'],['bets','Bets'],['pendingDeposits','Pending deposits'],['pendingWithdrawals','Pending withdrawals'],['totalStakes','Total stakes'],['totalBalances','User balances'],['totalPayouts','Total payouts'],['openBets','Open bets'],['wonBets','Won bets'],['lostBets','Lost bets']].map(([k,l])=>`<div class="card stat"><div class="label">${l}</div><div class="value">${['totalStakes','totalBalances','totalPayouts'].includes(k)?money(d[k]):esc(d[k])}</div></div>`).join('')}</div><div class="panel card" style="margin-top:18px"><h2>Operating boundaries</h2><p class="muted">Match controls, internal wallet records, balance adjustments, user activity, and approval states are enabled. External payment collection and payout execution remain disabled until a provider is configured.</p></div>`}
async function users(el){const rows=await api('/api/admin/users');el.innerHTML=`<div class="panel card"><div class="toolbar"><div class="field"><label>Search users</label><input id="userSearch" placeholder="Name, email, or ID"></div><button class="btn" id="searchUsers">Search</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>User</th><th>Contact</th><th>Balance</th><th>Created</th><th>Action</th></tr></thead><tbody>${rows.length?rows.map(u=>`<tr><td>${u.id}</td><td><b>${esc(u.name)}</b><br><span class="muted">${esc(u.email)}</span></td><td>${esc(u.phone||'—')}</td><td class="positive">${money(u.balance)}</td><td>${esc(u.created_at)}</td><td><button class="btn small" data-balance="${u.id}">Adjust balance</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No users yet.</td></tr>'}</tbody></table></div></div>`;document.getElementById('searchUsers').onclick=async()=>{const q=document.getElementById('userSearch').value;const found=await api(`/api/admin/users?search=${encodeURIComponent(q)}`);document.querySelector('tbody').innerHTML=found.map(u=>`<tr><td>${u.id}</td><td><b>${esc(u.name)}</b><br><span class="muted">${esc(u.email)}</span></td><td>${esc(u.phone||'—')}</td><td class="positive">${money(u.balance)}</td><td>${esc(u.created_at)}</td><td><button class="btn small" data-balance="${u.id}">Adjust balance</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No matching users.</td></tr>';bindBalance()};bindBalance()}
function bindBalance(){document.querySelectorAll('[data-balance]').forEach(b=>b.onclick=()=>balanceModal(b.dataset.balance))}
function balanceModal(id){const m=document.createElement('div');m.className='modal';m.innerHTML=`<section class="card"><h2>Adjust user balance</h2><p class="muted">User ID: ${esc(id)}. Use a positive amount to credit or a negative amount to debit.</p><form id="balanceForm"><div class="field"><label>Amount</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>Reason</label><textarea name="note" required placeholder="Explain this adjustment"></textarea></div><div class="actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn">Save adjustment</button></div></form></section>`;document.body.appendChild(m);m.querySelector('#cancel').onclick=()=>m.remove();m.querySelector('form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api(`/api/admin/users/${id}/balance`,{method:'PATCH',body:JSON.stringify(data)});m.remove();toast('Balance updated');renderSection()}catch(err){toast(err.message,true)}}}
async function wallet(el){const rows=await api('/api/admin/requests');el.innerHTML=`<div class="panel card"><h2>Manual review queue</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>User</th><th>Type</th><th>Amount</th><th>Method/reference</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${r.id}</td><td>${esc(r.user_name)}<br><span class="muted">${esc(r.user_email)}</span></td><td>${esc(r.request_type)}</td><td>${money(r.amount)}</td><td>${esc(r.method)}<br>${esc(r.reference||'—')}</td><td><span class="badge ${r.status}">${esc(r.status)}</span></td><td>${r.status==='pending'?`<div class="actions"><button class="btn green small" data-review="approve" data-id="${r.id}">Approve</button><button class="btn danger small" data-review="reject" data-id="${r.id}">Reject</button></div>`:'—'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No wallet requests.</td></tr>'}</tbody></table></div></div>`;document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{if(!confirm(`${b.dataset.review} request #${b.dataset.id}?`))return;try{await api(`/api/admin/requests/${b.dataset.id}/${b.dataset.review}`,{method:'POST'});toast('Request reviewed');renderSection()}catch(err){toast(err.message,true)}})}
async function bets(el){const rows=await api('/api/admin/bets');el.innerHTML=`<div class="panel card"><h2>All bets, stakes, wins and losses</h2><div class="table-wrap"><table><thead><tr><th>Bet</th><th>User</th><th>Stake</th><th>Possible win</th><th>Payout</th><th>Result</th><th>Action</th></tr></thead><tbody>${rows.length?rows.map(b=>`<tr><td>#${b.id}<br><span class="muted">${esc(b.booking_code)}</span></td><td>${esc(b.user_name)}<br><span class="muted">${esc(b.user_email)}</span></td><td>${money(b.stake)}</td><td>${money(b.possible_win)}</td><td>${money(b.payout)}</td><td><span class="badge ${b.result==='lost'?'rejected':b.result==='open'?'pending':''}">${esc(b.result)}</span><br><span class="muted">${esc(b.status)}</span></td><td>${b.result==='open'?`<div class="actions"><button class="btn green small" data-settle="won" data-id="${b.id}">Won</button><button class="btn danger small" data-settle="lost" data-id="${b.id}">Lost</button><button class="btn ghost small" data-settle="void" data-id="${b.id}">Void</button></div>`:'—'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No bets yet.</td></tr>'}</tbody></table></div></div>`;document.querySelectorAll('[data-settle]').forEach(b=>b.onclick=async()=>{if(!confirm(`Mark bet #${b.dataset.id} as ${b.dataset.settle}?`))return;try{await api(`/api/admin/bets/${b.dataset.id}/settle`,{method:'POST',body:JSON.stringify({result:b.dataset.settle})});toast('Bet settled');renderSection()}catch(err){toast(err.message,true)}})}
async function matches(el){const rows=await api('/api/admin/matches');el.innerHTML=`<div class="panel card"><div class="actions" style="justify-content:space-between"><h2>Match management</h2><button class="btn" id="newMatch">Add match</button></div><div class="table-wrap"><table><thead><tr><th>Match</th><th>Sport/league</th><th>Start</th><th>Odds</th><th>Status/score</th><th>Action</th></tr></thead><tbody>${rows.length?rows.map(m=>`<tr><td><b>${esc(m.home_team)} v ${esc(m.away_team)}</b><br><span class="muted">${esc(m.id)}</span></td><td>${esc(m.sport)}<br>${esc(m.league)}</td><td>${esc(m.start_time)}</td><td>${m.home_odds} / ${m.draw_odds} / ${m.away_odds}</td><td><span class="badge ${m.status==='live'?'live':''}">${esc(m.status)}</span><br>${m.home_score}-${m.away_score}</td><td><button class="btn small" data-match="${esc(m.id)}">Update</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No admin-created matches yet. Public demo fixtures remain available.</td></tr>'}</tbody></table></div></div>`;document.getElementById('newMatch').onclick=()=>matchModal();document.querySelectorAll('[data-match]').forEach(b=>b.onclick=()=>matchModal(b.dataset.match))}
function matchModal(id=''){const m=document.createElement('div');m.className='modal';m.innerHTML=`<section class="card"><h2>${id?'Update match':'Add match'}</h2><form id="matchForm">${id?'':`<div class="split"><div class="field"><label>Sport</label><input name="sport" required placeholder="football"></div><div class="field"><label>League</label><input name="league" required placeholder="Featured League"></div></div><div class="split"><div class="field"><label>Home team</label><input name="homeTeam" required></div><div class="field"><label>Away team</label><input name="awayTeam" required></div></div><div class="field"><label>Start time</label><input name="startTime" type="datetime-local" required></div>`}<div class="split"><div class="field"><label>Status</label><select name="status"><option value="upcoming">Upcoming</option><option value="live">Live</option><option value="finished">Finished</option><option value="suspended">Suspended</option></select></div><div class="field"><label>Home score</label><input name="homeScore" type="number" min="0" value="0"></div></div><div class="split"><div class="field"><label>Away score</label><input name="awayScore" type="number" min="0" value="0"></div><div class="field"><label>Home/draw/away odds</label><input name="homeOdds" type="number" step="0.01" value="1.5"><input name="drawOdds" type="hidden" value="3.2"><input name="awayOdds" type="hidden" value="2.15"></div></div><div class="actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn">Save match</button></div></form></section>`;document.body.appendChild(m);m.querySelector('#cancel').onclick=()=>m.remove();m.querySelector('form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{if(id)await api(`/api/admin/matches/${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify(data)});else await api('/api/admin/matches',{method:'POST',body:JSON.stringify(data)});m.remove();toast('Match saved');renderSection()}catch(err){toast(err.message,true)}}}
async function audit(el){const rows=await api('/api/admin/audit-log');el.innerHTML=`<div class="panel card"><h2>Admin audit log</h2><div class="table-wrap"><table><thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody>${rows.length?rows.map(a=>`<tr><td>${esc(a.created_at)}</td><td>${esc(a.admin_email)}</td><td>${esc(a.action)}</td><td>${esc(a.entity_type)} ${esc(a.entity_id||'')}</td><td><code>${esc(a.details_json||'{}')}</code></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No admin actions yet.</td></tr>'}</tbody></table></div></div>`}
(async()=>{if(!token)return loginView();try{const d=await api('/api/admin/auth/me');state.admin=d.admin;if(d.mustChangePassword)return changePasswordView();await appView()}catch{localStorage.removeItem('maxwin_admin_token');token='';loginView()}})();
</script>
</body>
</html>
