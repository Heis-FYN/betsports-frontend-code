    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/maxwin-logo.png" />
    <link rel="canonical" href="https://maxxwin.netlify.app/" />

    <meta name="twitter:image" content="/maxwin-logo.png" />
    <script>
      // Auto-recover from stale chunks / module 404s after new deployments
      window.addEventListener('error', function(e) {
        var isScriptError = (e && e.target && e.target.tagName === 'SCRIPT') || 
                            (e && e.message && (
                              e.message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
                              e.message.indexOf('Failed to load module script') !== -1 ||
                              e.message.indexOf('Expected a JavaScript-or-Wasm module script') !== -1
                            ));
        if (isScriptError) {
          var lastReload = sessionStorage.getItem('__z_chunk_reload');
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload, 10) > 6000) {
            sessionStorage.setItem('__z_chunk_reload', String(now));
            window.location.reload(true);
          }
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (msg.indexOf('Failed to fetch dynamically imported module') !== -1 || msg.indexOf('dynamically imported module') !== -1) {
          var lastReload = sessionStorage.getItem('__z_chunk_reload');
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload, 10) > 6000) {
            sessionStorage.setItem('__z_chunk_reload', String(now));
            window.location.reload(true);
          }
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(console.error));
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
